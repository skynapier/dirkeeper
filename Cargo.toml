[package]
name = "dirkeeper"
version = "0.1.0"
edition = "2024"
description = "Directory scan and resumable relocation CLI, with ssh remote mode"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skynapier/dirkeeper"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
blake3 = "1"
libc = "0.2"
mime_guess = "2.0"
thiserror = "2"
tempfile = "3"
toml = "1"
